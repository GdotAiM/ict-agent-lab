[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ftn-agent"
version = "0.1.0"
description = "ICT Filling The Numbers orchestration agent (paper-first, MINT-style)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GdotAiM" }]
dependencies = []

[project.optional-dependencies]
feed = ["yfinance>=0.2.40"]

[project.scripts]
ftn = "ftn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
